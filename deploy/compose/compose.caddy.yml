services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      DZZY_DOMAIN: ${DZZY_DOMAIN:?set DZZY_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dzzy-caddy-data:/data
      - dzzy-caddy-config:/config
    restart: unless-stopped
    networks:
      - dzzy-net

volumes:
  dzzy-caddy-data:
    labels:
      com.dzzy.volume: caddy-data
  dzzy-caddy-config:
    labels:
      com.dzzy.volume: caddy-config
