name: dzzy-prod

services:
  relay:
    image: ${DZZY_IMAGE:-ghcr.io/block/dzzy:main}
    env_file:
      - .env
    environment:
      DZZY_BIND_ADDR: 0.0.0.0:3000
      DZZY_HEALTH_PORT: "8080"
      DZZY_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-dzzy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dzzy}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      DZZY_S3_ENDPOINT: http://minio:9000
      DZZY_S3_ACCESS_KEY: ${DZZY_S3_ACCESS_KEY:?set DZZY_S3_ACCESS_KEY}
      DZZY_S3_SECRET_KEY: ${DZZY_S3_SECRET_KEY:?set DZZY_S3_SECRET_KEY}
      DZZY_S3_BUCKET: ${DZZY_S3_BUCKET:-dzzy-media}
      DZZY_GIT_REPO_PATH: /data/git
      DZZY_AUTO_MIGRATE: ${DZZY_AUTO_MIGRATE:-false}
      DZZY_GIT_CONFORMANCE_PROBE: ${DZZY_GIT_CONFORMANCE_PROBE:-true}
    ports:
      - "${DZZY_HTTP_PORT:-3000}:3000"
    volumes:
      - dzzy-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - dzzy-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dzzy}
      POSTGRES_USER: ${POSTGRES_USER:-dzzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dzzy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - dzzy-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - dzzy-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - dzzy-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DZZY_S3_ACCESS_KEY:?set DZZY_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${DZZY_S3_SECRET_KEY:?set DZZY_S3_SECRET_KEY}
    volumes:
      - dzzy-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - dzzy-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      DZZY_S3_ACCESS_KEY: ${DZZY_S3_ACCESS_KEY:?set DZZY_S3_ACCESS_KEY}
      DZZY_S3_SECRET_KEY: ${DZZY_S3_SECRET_KEY:?set DZZY_S3_SECRET_KEY}
      DZZY_S3_BUCKET: ${DZZY_S3_BUCKET:-dzzy-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${DZZY_S3_ACCESS_KEY}" "$${DZZY_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${DZZY_S3_BUCKET}"
        mc anonymous set none "local/$${DZZY_S3_BUCKET}"
      '
    restart: "no"
    networks:
      - dzzy-net

volumes:
  dzzy-postgres-data:
    labels:
      com.dzzy.volume: postgres
  dzzy-redis-data:
    labels:
      com.dzzy.volume: redis
  dzzy-minio-data:
    labels:
      com.dzzy.volume: minio
  dzzy-git-data:
    labels:
      com.dzzy.volume: git

networks:
  dzzy-net:
    driver: bridge
    labels:
      com.dzzy.network: production
